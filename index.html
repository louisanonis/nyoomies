<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hull Bracers</title>
  <meta name="description" content="Race your way out of a mirrored neon underground. A roguelike racer.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game"></canvas>
  <div id="ui"></div>
  <div id="nefer" role="status" aria-live="polite"></div>
  <div id="boot-error" hidden></div>
  <script type="module" src="src/main.js"></script>
  <script>
    // Plain-ES5 boot guard: explains a blank screen instead of leaving one.
    (function () {
      function fail(html) {
        var el = document.getElementById('boot-error');
        el.innerHTML = html;
        el.hidden = false;
      }
      if (location.protocol === 'file:') {
        fail('<h2>Almost there</h2><p>Browsers block games opened straight from a file. ' +
          'Run <code>npm start</code> in the game folder and open <b>http://localhost:8080</b>.</p>');
        return;
      }
      setTimeout(function () {
        if (!window.__hullBracers) {
          fail('<h2>This browser can\'t run Hull Bracers</h2><p>Please update to a recent version of ' +
            'Chrome, Edge, Firefox or Safari (16 or newer).</p>');
        }
      }, 6000);
    })();
  </script>
</body>
</html>
